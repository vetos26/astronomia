name: Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK Generated
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astranomia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Astranomia Android Release (${{ github.ref_name }})
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🛸 Astranomia - Android APK (Kotlin)
            * **Комбайн:** «ДОН-1500А» (красный кузов, белая надпись, панорамная кабина)
            * **Герой:** Дед Макар в шапке-ушанке с красной советской звездой
            * **Управление:** Виртуальная крестовина слева, кнопки «Огонь», «Перезарядка», «Супер оружие» справа
            * **Саундтрек:** Меню играет «Astronomia», геймплей — Агро-Фонк
          draft: false
          prerelease: false
