name: Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Debug APK
        id: gradle_build
        run: |
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log
        continue-on-error: true

      - name: Check Build Result and Annotate
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            FIRST_ERR=$(grep -m 1 -E "e: |FAILURE: " gradle-build.log | tr '\n' ' ')
            echo "::error title=Compiler Error::$FIRST_ERR"
            echo "=== Gradle Log Errors ==="
            grep -E "^e: |FAILURE:|What went wrong:" gradle-build.log -A 4 | head -n 30
            exit 1
          fi

      - name: Verify APK Generated
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astranomia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Astranomia Android APK (Latest Build)
          tag_name: v1.0-apk
          body: |
            ## 🛸 Astranomia — Сборка игры для Android (APK)

            Готовый APK файл игры **Astranomia** для установки на Android (версии 7.0+ / Android 14).

            ### 🎮 Особенности:
            * 🚜 **Легендарный зерноуборочный комбайн «ДОН-1500А»**: аутентичный красный цвет, белая надпись «ДОН 1500» на борту, детализированная панорамная кабина и жатка.
            * 👨‍🌾 **Дед Макар**: комбайнер в шапке-ушанке с красной советской звездой, защищающий ночное пшеничное поле.
            * 👾 **Инопланетная угроза**: летающие тарелки (НЛО), дроны-похитители урожая и инопланетные зонды.
            * 🕹️ **Интерфейс и управление**:
              * **Слева**: экранная крестовина (D-Pad: ▲, ▼, ◄, ►).
              * **Справа**: боевые кнопки **«ОГОНЬ»**, **«ПЕРЕЗАРЯДКА»**, **«СУПЕР ОРУЖИЕ»**.
              * **Сверху слева**: кнопка **«МЕНЮ»**, значок комбайна, шкала жизни комбайна (HP Bar) и индикатор набранных очков **«ОЧКИ»** строго над полоской жизни.
            * 🎵 **Звук и музыка**:
              * Меню: культовый трек **«Astronomia»**
              * Битва на поле: драйвовый **Агро-Фонк (Drift Phonk)**

            ---
            *Файл для загрузки: `app-debug.apk` (прикреплен ниже)*
          draft: false
          prerelease: false
